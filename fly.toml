app = "firmament-api"
primary_region = "bom"

[build]
  dockerfile = "docker/solver.Dockerfile"

[http_service]
  internal_port = 5050
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"

[[mounts]]
  source = "firmament_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
