name: Build Solver Image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - v0.1.0
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - web/app/**
      - landing/**
      - package.json
      - scripts/check-web-polish.mjs
      - docker/solver.Dockerfile
      - docker/solver-entrypoint.sh
      - .github/workflows/solver-image.yml
  push:
    branches:
      - main
      - v0.1.0
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - docker/solver.Dockerfile
      - docker/solver-entrypoint.sh
      - .github/workflows/solver-image.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/firmament-solver
  IMAGE_TAG: v0.1.3
  IMAGE_TAG_AMD64: amd64-v0.1.3

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/app/package-lock.json
            landing/package-lock.json

      - name: Install app dependencies
        run: npm ci --prefix web/app

      - name: Install landing dependencies
        run: npm ci --prefix landing

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build app
        run: npm run app:build

      - name: Lint landing
        run: npm --prefix landing run lint

      - name: Build landing
        run: npm run landing:build

      - name: Check web polish
        run: npm run web:polish

  build-and-push:
    name: Build and push amd64 solver image
    runs-on: ubuntu-latest
    needs: quality-gates
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/solver.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_AMD64 }}
