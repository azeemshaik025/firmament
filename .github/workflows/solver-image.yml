name: Build Solver Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v0.1.0
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - docker/solver.Dockerfile
      - docker/solver-entrypoint.sh
      - .github/workflows/solver-image.yml

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/firmament-solver
  IMAGE_TAG: amd64-v0.1.1

jobs:
  build-and-push:
    name: Build and push amd64 solver image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/solver.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
