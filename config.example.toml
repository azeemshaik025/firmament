[http]
bind_address = "127.0.0.1"
port = 5050

[solana]
cluster = "mainnet-beta"
commitment = "confirmed"

[assets.policy]
max_action_notional_usd = "2"
max_cumulative_automation_notional_usd = "15"
non_stable_asset_exception_notional_usd = "5"
default_quote_expiry_seconds = 45
base_spread_bps = 35

[[assets.supported]]
id = "USDC"
symbol = "USDC"
mint = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
decimals = 6
enabled = true
target_weight = "0.60"
quoteable_threshold_raw = 2_000_000
min_trade_notional_usd = "1"
max_trade_notional_usd = "2"

[[assets.supported]]
id = "SOL"
symbol = "SOL"
mint = "So11111111111111111111111111111111111111112"
decimals = 9
enabled = true
target_weight = "0.35"
quoteable_threshold_raw = 10_000_000
min_trade_notional_usd = "1"
max_trade_notional_usd = "2"

[[assets.supported]]
id = "cbBTC"
symbol = "cbBTC"
mint = "VERIFY_CBBTC_SOLANA_MINT_BEFORE_LIVE_USE"
decimals = 8
enabled = true
target_weight = "0.05"
quoteable_threshold_raw = 1_000
min_trade_notional_usd = "1"
max_trade_notional_usd = "5"

# Every enabled supported asset can quote against every other enabled asset by
# default. Add directional blacklist rows only for pairs you want to disable.
# [[assets.blacklisted_pairs]]
# input = "SOL"
# output = "cbBTC"

[risk]
max_quote_notional_usd = "2"
max_trade_notional_usd = "2"
max_daily_notional_usd = "15"
max_non_stable_asset_notional_usd = "5"
max_inventory_drift_bps = 1_500
max_price_staleness_seconds = 20
require_taker_allowlist = false

[jupiter]
enabled = true
base_url = "https://lite-api.jup.ag"
max_slippage_bps = 50
quote_timeout_millis = 2_000

[gateway]
enabled = true
usdc_refill_threshold_raw = 3_000_000
usdc_refill_target_raw = 10_000_000
usdc_excess_deposit_threshold_raw = 12_000_000
usdc_excess_deposit_target_raw = 10_000_000
max_refill_notional_usd = "2"
max_refill_fee_raw = 250_000

[runtime]
event_capacity = 256
scaffold_hold_millis = 0
# `cargo run` starts the maker API runtime.
enable_protocol_workers = false
database_path = "runtime.sqlite"

[admin]
allowed_users = ["admin"]
session_ttl_seconds = 28800
cookie_secure = false

[reconciliation]
# Always-on Solana reconciliation worker. The whole section is optional —
# safe defaults apply when it is omitted entirely.
interval_seconds = 10
consecutive_ticks_for_adjustment = 3
emit_event_on_skip = true

[reconciliation.dust]
# Per-asset dust thresholds in raw native units. Drifts at or below these
# values are ignored; drifts above must be observed
# `consecutive_ticks_for_adjustment` times in a row before the worker
# posts a balanced ledger adjustment.
USDC = 10000
SOL = 100000
cbBTC = 100

[runtime.automation]
# Always-on automation workers (rebalance / Gateway refill / native SOL
# top-up). Default-off in code so test harnesses do not race with
# explicit trade-driven triggers; production opts in here. Each loop
# runs one scoped automation decision and is serialized through the
# automation mutex so the trade-driven path and these workers cannot
# stack overlapping adapter actions.
enabled = true
rebalance_interval_seconds = 60
gateway_refill_interval_seconds = 30
native_top_up_interval_seconds = 60
excess_deposit_interval_seconds = 60
